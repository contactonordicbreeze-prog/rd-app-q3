<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <title>Rinde</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Seguimiento del rendimiento de tu FCI. Tus datos quedan en tu dispositivo.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo.
    try { const t = JSON.parse(localStorage.getItem('rinde.v1') || '{}')?.settings?.theme; if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación">
      <div class="brand"><img src="icons/logo.svg" alt="" width="32" height="32"><span>Rinde</span></div>
      <nav class="nav" id="nav-side"></nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" id="nav-bottom" aria-label="Navegación"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
